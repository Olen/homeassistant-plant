# Configures GitHub's native release-notes generator (used by the Auto Release
# workflow via `generate_release_notes: true`). PRs are bucketed by their labels;
# label every PR so it lands in the right category. Unlabeled PRs fall into
# "Other Changes". See CONTRIBUTING.md.
changelog:
  # Nothing here changes what a user runs: `release` is the manifest bump
  # itself, the rest is workflow and action plumbing. `chore` is deliberately
  # NOT excluded -- it has carried translations and entity renames.
  exclude:
    labels:
      - release
      - ci
      - github_actions
      - dependencies
  categories:
    - title: 🚀 Features & Enhancements
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧹 Maintenance
      labels:
        - chore
    - title: Other Changes
      labels:
        - "*"

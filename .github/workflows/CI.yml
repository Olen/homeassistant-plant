name: CI

on:
  # Only run push on main/master. Feature branches are covered by the
  # pull_request event, so this avoids running the whole matrix twice for a push
  # to a branch that already has an open PR. Push-on-main is also what the Auto
  # Release workflow keys on (CI completing on main), so it must stay.
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 15 * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install linters
        run: uv pip install black ruff --system

      - name: Check formatting (black)
        run: black . --check --fast --diff

      - name: Check linting (ruff)
        run: ruff check .

  test:
    name: Tests (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    # Non-blocking for the experimental "beta" matrix entry; required otherwise.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest HA version - uses current pytest-homeassistant-custom-component
          - ha-version: "latest"
            pytest-ha-version: ""
          # Lowest TESTED HA version. hacs.json still declares support for 2025.8+
          # (the plant.* triggers stay inert below 2026.7 — see trigger.py), but CI
          # only tests 2026.3+: it is the first HA requiring Python 3.14, and older
          # HA needs an aiodns/pycares workaround we no longer carry.
          # pytest-homeassistant-custom-component 0.13.320 -> HA 2026.3.4.
          - ha-version: "2026.3"
            pytest-ha-version: "==0.13.320"
          # Latest HA prerelease/beta (NON-BLOCKING, see continue-on-error), so
          # breakage in an upcoming HA release surfaces here before users see it.
          # Tested with the official pytest-home-assistant, which replaced
          # pytest-homeassistant-custom-component in HA 2026.11.
          - ha-version: "beta"
            pytest-ha-version: ""
            experimental: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # HA 2026.3+ requires Python 3.14
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          rm -f uv.lock  # Prevent editable install from lock file
          uv venv
          # Install the integration's runtime deps AND test deps, except
          # pytest-homeassistant-custom-component (pinned separately below). The
          # runtime deps (e.g. async-timeout) must be installed explicitly: newer
          # HA no longer pulls them transitively, so relying on HA to provide them
          # breaks on the latest HA.
          # Use --no-cache to ensure clean dependency resolution
          uv pip install --no-cache $(python -c "
          import tomllib
          proj = tomllib.load(open('pyproject.toml', 'rb'))['project']
          deps = proj.get('dependencies', []) + proj['optional-dependencies']['test']
          filtered = [d for d in deps if not d.startswith('pytest-homeassistant-custom-component')]
          print(' '.join(filtered))
          ")

      - name: Install pytest-homeassistant-custom-component
        if: matrix.ha-version != 'beta'
        run: uv pip install --no-cache "pytest-homeassistant-custom-component${{ matrix.pytest-ha-version }}"

      - name: Install the newest HA prerelease and pytest-home-assistant (beta job only)
        if: matrix.ha-version == 'beta'
        # pytest-home-assistant must match the installed HA. It is not on PyPI
        # yet, so it comes from the core tag of that HA version.
        run: |
          uv pip install --no-cache --prerelease=allow --upgrade homeassistant
          HA_VERSION=$(.venv/bin/python -c "from homeassistant.const import __version__; print(__version__)")
          uv pip install --no-cache "pytest-home-assistant @ git+https://github.com/home-assistant/core@${HA_VERSION}#subdirectory=packages/pytest-home-assistant"

      - name: Show installed versions
        run: |
          .venv/bin/python -c "from homeassistant.const import __version__; print(f'Home Assistant version: {__version__}')"
          uv pip show --python .venv/bin/python pytest-home-assistant pytest-homeassistant-custom-component 2>/dev/null | grep -E "^(Name|Version)" || true
          uv pip show --python .venv/bin/python pycares aiodns | grep -E "^(Name|Version)"

      - name: Run tests
        run: .venv/bin/pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: .venv/bin/pytest tests/ --cov=custom_components/plant --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  validate:
    name: Validate Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

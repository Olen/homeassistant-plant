---
name: "Auto Release"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write
  pull-requests: read

jobs:
  auto-release:
    name: "Auto Release"
    runs-on: "ubuntu-latest"
    # Only after CI succeeds on a push to this repository (a fork's branch can also be named main)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "Check if manifest.json changed"
        id: check_manifest
        run: |
          # Get the commits from the workflow run
          BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -z "$BEFORE_SHA" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only $BEFORE_SHA HEAD -- 'custom_components/*/manifest.json' | wc -l)
            if [ "$CHANGED" -gt 0 ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: "Get version tag"
        id: set_var
        run: echo "COMPONENT_VERSION=$(jq -r .version custom_components/*/manifest.json)" >> $GITHUB_ENV
        if: steps.check_manifest.outputs.changed == 'true'

      - name: "Check if tag exists already"
        uses: mukunku/tag-exists-action@v1.7.0
        id: "check_tag"
        with:
          tag: "v${{ env.COMPONENT_VERSION }}"
        if: steps.check_manifest.outputs.changed == 'true'

      - name: "Skip if no manifest change or tag exists"
        run: echo "Skipping release - manifest unchanged or tag already exists"
        if: steps.check_manifest.outputs.changed != 'true' || steps.check_tag.outputs.exists == 'true'

      - name: "Create new tag"
        uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: "v${{ env.COMPONENT_VERSION }}"
          tag_exists_error: false
          message: "Version ${{ env.COMPONENT_VERSION }}"
        if: steps.check_manifest.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      # GitHub's native release notes: auto-detects the previous tag (so a beta's
      # notes don't span back to the last stable) and buckets PRs by label per
      # .github/release.yml. Replaces the raw changelog-generator dump.
      - name: "Create Stable release"
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          name: "Version ${{ env.COMPONENT_VERSION }}"
          tag_name: "v${{ env.COMPONENT_VERSION }}"
        if: steps.check_manifest.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true' && contains(env.COMPONENT_VERSION, 'beta') == false

      - name: "Create Beta release"
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          name: "Version ${{ env.COMPONENT_VERSION }}"
          tag_name: "v${{ env.COMPONENT_VERSION }}"
        if: steps.check_manifest.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true' && contains(env.COMPONENT_VERSION, 'beta') == true

      - name: "Add bundled flower card notes"
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^)
          python3 scripts/flower_card_notes.py --since-tag "$PREVIOUS_TAG" --release-ref HEAD > card-notes.md
          if [ -s card-notes.md ]; then
            gh release view "v$VERSION" --json body --jq .body > release-notes.md
            printf '\n' >> release-notes.md
            cat card-notes.md >> release-notes.md
            gh release edit "v$VERSION" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.COMPONENT_VERSION }}
        if: steps.check_manifest.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'
